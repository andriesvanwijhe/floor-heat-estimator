fit_now:
  name: Fit now
  description: Queue a background fit of both thermal models using the configured rolling learning window. Inspect Fit status for the result.
  fields:
    entry_id:
      name: Configuration
      description: Optional when only one configuration is loaded.
      selector:
        config_entry:
          integration: floor_heat_estimator
    include_legacy:
      name: Include recordings from version 0.1
      description: Use old recordings only if their source sensors and flow/mode settings match the current configuration. They have no recorded source signature.
      default: false
      selector:
        boolean:
    apply:
      name: Apply validated results
      description: Override the automatic-application setting for this fit. False performs a preview only.
      selector:
        boolean:
reset_parameters:
  name: Restore manual parameters
  description: Discard active learned coefficients and restore the configured manual values. Training files remain available. Scheduled learning remains enabled if configured.
  fields:
    entry_id:
      name: Configuration
      selector:
        config_entry:
          integration: floor_heat_estimator
import_history_and_fit:
  name: Import history and fit
  description: Import available detailed Recorder history for the learning window, then fit both models. Live recordings take precedence. Inspect Fit status for the result.
  fields:
    entry_id:
      name: Configuration
      description: Optional when only one configuration is loaded.
      selector:
        config_entry:
          integration: floor_heat_estimator
    apply:
      name: Apply validated results
      description: Override automatic application for this fit; false previews candidates.
      selector:
        boolean:
fit_house_now:
  name: Fit house now
  description: Fit the two-state house model in a bounded background process. Inspect House fit status for validation and parameter uncertainty.
  fields:
    entry_id:
      name: Configuration
      description: Optional when only one configuration is loaded.
      selector:
        config_entry:
          integration: floor_heat_estimator
    apply:
      name: Apply validated results
      description: Override automatic application; false previews the candidate without changing active parameters.
      selector:
        boolean:
    force:
      name: Force provisional fit
      description: Bypass normal data and quality gates. Requires twelve hours, 96 measured points and a converged finite fit. A forced fit previews by default; explicitly set apply true to activate provisional parameters.
      default: false
      selector:
        boolean:

import_house_history_and_fit:
  name: Import house history and fit
  description: Import detailed local history then fit the house model, replaying raw floor measurements with one frozen calibration when the selected heat source belongs to this entry.
  fields:
    entry_id:
      name: Configuration
      description: Optional when only one configuration is loaded.
      selector:
        config_entry:
          integration: floor_heat_estimator
    apply:
      name: Apply validated results
      description: Override automatic application; false previews the candidate without changing active parameters.
      selector:
        boolean:
    force:
      name: Force provisional fit
      description: Bypass normal data and quality gates. Requires twelve hours, 96 measured points and a converged finite fit. A forced fit previews by default; explicitly set apply true to activate provisional parameters.
      default: false
      selector:
        boolean:

reset_house_parameters:
  name: Restore manual house parameters
  description: Restore configured manual house coefficients. Training recordings remain available.
  fields:
    entry_id:
      name: Configuration
      description: Optional when only one configuration is loaded.
      selector:
        config_entry:
          integration: floor_heat_estimator
